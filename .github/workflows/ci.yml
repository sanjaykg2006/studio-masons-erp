name: CI

# The quality gate. Runs on every pull request and on pushes to main. A change
# cannot be safely merged unless all of these pass: lint, type-check, tests, and
# a production build.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values so the build can validate its env schema without real secrets.
    # These are NOT used to reach a real database; the build only needs them to
    # be present and well-formed.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The database's own rules — approvals, money, purchase orders, who sees what
  # (supabase/tests/database). Builds a throwaway database from every migration
  # and runs the pgTAP checks against it. A separate job, so a failure shows red
  # and emails the owner without holding up the main gate.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Start a throwaway database from the migrations
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Database checks
        run: supabase test db
