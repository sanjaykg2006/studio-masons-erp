name: CI

# The quality gate. Runs on every pull request and on pushes to main. A change
# cannot be safely merged unless all of these pass: lint, type-check, tests, and
# a production build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values so the build can validate its env schema without real secrets.
    # These are NOT used to reach a real database; the build only needs them to
    # be present and well-formed.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
