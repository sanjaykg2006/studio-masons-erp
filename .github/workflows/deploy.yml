name: Deploy

# Releases a branch in the safe order: database changes FIRST, then the website.
#   staging -> the test ERP (test Supabase project + Vercel preview site)
#   main    -> the live ERP (live Supabase project + Vercel production site)
# Merging the staging -> main pull request on GitHub is the "go live" button;
# the "Protect main" ruleset only allows that merge once CI's checks pass.
# Vercel's own deploy-on-push is switched off for these two branches
# (vercel.json), so the website never goes out ahead of its database change.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A database login only (the project's session-pooler connection string),
      # not a Supabase account token — least power that can still migrate.
      DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_URL_LIVE || secrets.SUPABASE_DB_URL_TEST }}
      DEPLOY_HOOK: ${{ github.ref_name == 'main' && secrets.VERCEL_DEPLOY_HOOK_PRODUCTION || secrets.VERCEL_DEPLOY_HOOK_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Apply database changes (${{ github.ref_name == 'main' && 'live' || 'test' }})
        run: supabase db push --db-url "$DB_URL" --yes

      - name: Publish the website (${{ github.ref_name == 'main' && 'live' || 'test' }})
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
